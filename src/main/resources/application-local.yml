# =====================================================================
# elcm-ui — LOCAL profile (developer machine only; never deployed)
#
# Supplies every value the base file expects from the environment or Key
# Vault, so the local profile needs nothing from Azure.
#
# HTTPS is required locally because the session cookie is secure=true;
# browsers drop secure cookies over plain HTTP.
#
# Keystores live OUTSIDE the project (shared with ecws-ui), never in
# src/main/resources:
#   ${user.home}/.dodaso/certs/dodaso_keystore.p12
#   ${user.home}/.dodaso/certs/dodaso_truststore.p12
# Override the folder with the DODASO_CERT_DIR environment variable.
#
# The secret defaults below are DEV-ONLY values. Real values for any shared
# environment come from Key Vault, never from this file.
# =====================================================================

dodaso:
  local:
    cert-dir: ${DODASO_CERT_DIR:${user.home}/.dodaso/certs}
  instance:
    customer-code: local
    display-name: Local Dev
    environment: local
    ecws-base-url: https://localhost/ecws
    elcm-base-url: https://localhost/elcm
    auth-issuer-uri: https://localhost:8081

# Secrets that come from Key Vault in the cloud (dev values only).
elcm-ui-oauth-client-secret: ${ELCM_UI_OAUTH_CLIENT_SECRET:jsf-client-secret}
# Same value as before, so local token handling keeps working. It has been in
# git, so it must never be used outside local development.
elcm-ui-jwt-secret: ${ELCM_UI_JWT_SECRET:9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9}

spring:
  main:
    lazy-initialization: true     # faster local restarts
  security:
    oauth2:
      client:
        registration:
          sso:
            # Kept exactly as registered on the local authorization server
            # (with the explicit :443). The derived base value
            # (https://localhost/elcm/...) would not match that registration.
            redirect-uri: https://localhost:443/elcm/login/oauth2/code/sso

server:
  port: 333
  ssl:
    enabled: true
    key-store-type: PKCS12
    key-store: file:${dodaso.local.cert-dir}/dodaso_keystore.p12
    key-store-password: changeit
    key-alias: dodaso-server

eureka:
  client:
    service-url:
      defaultZone: https://localhost:9443/eureka/
    tls:
      enabled: true
      trust-store: file:${dodaso.local.cert-dir}/dodaso_truststore.p12
      trust-store-password: changeit
      trust-store-type: PKCS12
  instance:
    secure-port-enabled: true
    secure-port: 333
    non-secure-port-enabled: false
    status-page-url: https://localhost:333/elcm/actuator/info
    health-check-url: https://localhost:333/elcm/actuator/health
    home-page-url: https://localhost:333/elcm

app:
  file:
    upload:
      directory: C:/development/uploads

logging:
  level:
    com.dodaso.ecosystem.elcm: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.security.oauth2.client: DEBUG