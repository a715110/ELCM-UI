<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"

<h:head>

        <link rel="icon" href="#{request.contextPath}/resources/elcm-custom/images/elcm-favicon-180.png"

    </f:facet>
    <title><ui:insert name="title">Enterprise Contract Lease Management</ui:insert></title>
    <h:outputScript name="js/layout.js" library="rain-layout"/>
    <h:outputScript name="js/prism.js" library="rain-layout"/>
    <!-- ADDED (2026-08-15): this was missing entirely - not commented out,
         just never present. Without it every PrimeFaces component
         (buttons, inputs, tables, tags - everything dashboard.xhtml uses)
         renders with zero component styling, separately from the
         layout/topbar CSS below. library resolves via
         RainPreferences.getTheme() (componentTheme + "-" + darkMode,
         "cyan-light" by default) - confirmed that folder exists in
         resources.zip as primefaces-rain-cyan-light/theme.css. -->
    <h:outputStylesheet name="theme.css" library="primefaces-rain-#{rainPreferences.theme}"/>
    <ui:insert name="head"/>
</h:head>
